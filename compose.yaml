services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    working_dir: /app
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      NODE_ENV: development
      PORT: 7001
      PUBLIC_URL: http://localhost:7001
      MONGO_URI: mongodb://mongo:27017/kuepa_test?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-kuepa.admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-KuepaDev2026!}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./back:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    command: sh -c "npm run cli -- --seeder initSeeder -f && npm run dev"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:7001
      VITE_PUBLIC_URL: http://localhost:7001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./front:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
